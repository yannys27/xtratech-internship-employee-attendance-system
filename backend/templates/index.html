<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            margin: 0;
        }

        .navbar {
            background: #007BFF;
            color: white;
            padding: 15px;
        }

        .container {
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,.1);
        }

        a {
            display: inline-block;
            margin: 10px;
            padding: 12px 18px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>

<div class="navbar">
    <h2>Employee and Attendance Management System</h2>
</div>

<div class="container">

    <div class="card">
        <h3>Dashboard</h3>
        <p>Welcome to the management system.</p>

        <a href="/employees-page">Employee Management</a>
        <a href="/attendance-page">Attendance Management</a>
        <a href="/reports-page">Reports</a>
        <a href="/logout">Logout</a>
    </div>

</div>

</body>
</html>
